[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "mcp-webs"
version = "1.0.2"
description = "MCP Web Search service for AI ecosystem"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2",
    "redis>=5.2",
    "structlog>=25.1",
    "pydantic-settings>=2.8",
    "ddgs>=8.0",
    "trafilatura>=2.0",
    "readability-lxml>=0.8",
    "beautifulsoup4>=4.13",
    "bleach>=6.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "instructor>=1.7",
    "httpx>=0.28",
    "tavily>=0.4",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "bandit>=1.9",
    "coverage>=7.13.5",
    "mypy>=2.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15",
]
