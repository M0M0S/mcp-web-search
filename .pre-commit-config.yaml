default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff
        name: ruff lint
        entry: uv run ruff check --select=E,F,W,I
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy (app)
        entry: uv run mypy app/
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit (app)
        entry: uv run bandit -r app/ -ll
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-full
        name: run all tests (excluding integration)
        entry: uv run pytest tests/ --ignore=tests/integration/ -v --tb=short
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-warnings
        name: run tests with ResourceWarning as errors
        entry: uv run pytest tests/ --ignore=tests/integration/ -v --tb=short -W error::ResourceWarning
        language: system
        types: [python]
        pass_filenames: false

      - id: pip-audit
        name: pip-audit (dependencies)
        entry: uv run pip-audit
        language: system
        pass_filenames: false

      - id: uv-lock-sync
        name: uv lock sync
        entry: uv lock --check
        language: system
        pass_filenames: false
