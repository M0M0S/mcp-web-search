default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff
        name: ruff lint
        entry: uv run ruff check --select=E,F,W,I --ignore=E501
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy (app)
        entry: uv run mypy app/ --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit (app)
        entry: uv run bandit -r app/ -ll
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-unit
        name: run unit tests
        entry: uv run pytest tests/unit/ -v
        language: system
        types: [python]
        pass_filenames: false
