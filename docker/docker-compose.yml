services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mcp-webs
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mcp-webs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
